<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Places</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header class="site-header">

            <div>
                <h1>Places</h1>
            </div>

        </header>


        <!-- COUNTRY -->

        <section class="country-controls">

            <div class="country-display">

                <span id="countryFlag">
                    🇯🇵
                </span>

                <span id="countryName">
                    Japan
                </span>

            </div>

        </section>


        <!-- CATEGORY FILTERS -->

        <section class="category-section">

            <div
                class="category-buttons"
                id="categoryButtons"
            >

                <button
                    type="button"
                    class="category-button active"
                    data-category="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="sightseeing"
                >
                    Sightseeing
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="restaurants"
                >
                    Restaurants
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="nightlife"
                >
                    Nightlife
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="shopping"
                >
                    Shopping
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="experiences"
                >
                    Experiences
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="hobbies"
                >
                    Hobbies
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="meetups"
                >
                    Meetups
                </button>

            </div>

        </section>


        <!-- RESULT COUNT -->

        <div id="resultCount">
            Loading recommendations...
        </div>


        <!-- PLACE CARDS -->

        <main>

            <section
                id="placesContainer"
                class="places-grid"
            >
                <div class="empty-state">

                    <h3>
                        Finding places...
                    </h3>

                    <p>
                        Loading recommendations.
                    </p>

                </div>
            </section>

        </main>


        <!-- FOOTER -->

        <footer class="site-footer">

            <p>
                Address and Description information is gathered
                automatically from open APIs and can be inaccurate.
            </p>

            <!-- Begin Yahoo! JAPAN Web Services Attribution Snippet -->

            <span style="margin:15px 15px 15px 15px">
                <a
                    href="https://developer.yahoo.co.jp/sitemap/"
                >
                    Web Services by Yahoo! JAPAN
                </a>
            </span>

            <!-- End Yahoo! JAPAN Web Services Attribution Snippet -->

        </footer>

    </div>


    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
